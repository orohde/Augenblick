[project]
name = "augenblick"
dynamic = ["version"]
description = "Folder-based photo library: your folders stay the truth, metadata lives in the files"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "segno>=1.6",
    "anthropic>=2.6",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
augenblick = "augenblick.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
augenblick = ["static/**/*", "VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
